<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Coins Clone</title>
    <style>
        :root {
            --tiktok-red: #fe2c55;
            --bg-color: #f8f8f8;
            --text-main: #161823;
            --text-muted: #16182380;
            --border-color: #e5e5e5;
            --card-selected-border: #f2b740;
            --card-selected-bg: #fff9ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            height: 100vh;
            max-height: 800px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-main);
            margin-right: 15px;
        }
        .header .title {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            font-size: 17px;
            margin-right: 25px; /* Balance center */
        }

        /* Content */
        .content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Search Input */
        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .search-box span {
            color: var(--text-muted);
            margin-right: 10px;
            font-size: 18px;
        }
        .search-box input {
            border: none;
            background: transparent;
            font-size: 16px;
            width: 100%;
            outline: none;
            color: var(--text-main);
        }

        /* Banner */
        .banner {
            color: var(--tiktok-red);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .banner .info-icon {
            background-color: #888;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

        /* Grid de Moedas */
        .coins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .coin-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .coin-card.selected {
            border-color: var(--card-selected-border);
            background-color: var(--card-selected-bg);
        }
        .coin-icon {
            color: #f2b740;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .coin-amount {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .coin-price {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Footer / Botão de Recarga */
        .footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer .total-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }
        .btn-recharge {
            background-color: var(--tiktok-red);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- MODAL (POPUP) --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: white;
            width: 80%;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .success-icon {
            width: 50px;
            height: 50px;
            background-color: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin: 0 auto 15px auto;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .receipt-details {
            text-align: right;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
            color: var(--text-main);
        }
        .receipt-details .status {
            color: #f97316; /* Laranja do APPROVED */
            font-weight: bold;
        }

        .btn-done {
            background-color: var(--tiktok-red);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Cabeçalho -->
        <div class="header">
            <div class="back-btn">&lt;</div>
            <div class="title">Get Coins</div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="content">
            <h1>Recharge</h1>
            
            <div class="search-box">
                <span>&#128269;</span> <!-- Ícone Lupa -->
                <input type="text" id="usernameInput" value="@___.santos006">
            </div>

            <div class="banner">
                Save up to 31% compared to in-app purchase <span class="info-icon">i</span>
            </div>

            <!-- Opções de Moedas -->
            <div class="coins-grid">
                <div class="coin-card" onclick="selectCoin(this, '70', '$0.74')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">70</div>
                    <div class="coin-price">$0.74</div>
                </div>
                <div class="coin-card" onclick="selectCoin(this, '350', '$3.70')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">350</div>
                    <div class="coin-price">$3.70</div>
                </div>
                <div class="coin-card" onclick="selectCoin(this, '700', '$7.40')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">700</div>
                    <div class="coin-price">$7.40</div>
                </div>
                <div class="coin-card" onclick="selectCoin(this, '1,400', '$14.80')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">1,400</div>
                    <div class="coin-price">$14.80</div>
                </div>
                <div class="coin-card" onclick="selectCoin(this, '3,500', '$37.00')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">3,500</div>
                    <div class="coin-price">$37.00</div>
                </div>
                <!-- Card Selecionado por Padrão -->
                <div class="coin-card selected" onclick="selectCoin(this, '7,000', '$74.00')">
                    <div class="coin-icon">🟡</div>
                    <div class="coin-amount">7,000</div>
                    <div class="coin-price">$74.00</div>
                </div>
            </div>
        </div>

        <!-- Rodapé / Botão de Pagamento -->
        <div class="footer">
            <div class="total-price" id="totalPriceDisplay">$74.00</div>
            <button class="btn-recharge" onclick="showModal()">Recharge</button>
        </div>

        <!-- Modal de Confirmação (Visão da Imagem 2) -->
        <div class="modal-overlay" id="successModal">
            <div class="modal-box">
                <div class="success-icon">&#10004;</div>
                <div class="modal-title">Recharge completed</div>
                
                <div class="receipt-details">
                    <div id="modalUser">@___.santos006</div>
                    <div id="modalCoins">7,000</div>
                    <div id="modalPrice">$74.00</div>
                    <div class="status">APPROVED</div>
                </div>

                <button class="btn-done" onclick="hideModal()">Done</button>
            </div>
        </div>

    </div>

    <script>
        let currentCoins = "7,000";
        let currentPrice = "$74.00";

        // Função para trocar a seleção do card de moedas
        function selectCoin(element, coins, price) {
            // Remove a classe 'selected' de todos os cards
            const cards = document.querySelectorAll('.coin-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            // Adiciona a classe 'selected' ao card clicado
            element.classList.add('selected');
            
            // Atualiza os valores selecionados
            currentCoins = coins;
            currentPrice = price;
            
            // Atualiza o rodapé
            document.getElementById('totalPriceDisplay').innerText = currentPrice;
        }

        // Função para mostrar o popup de sucesso
        function showModal() {
            const username = document.getElementById('usernameInput').value;
            
            // Injeta os dados atualizados no modal
            document.getElementById('modalUser').innerText = username;
            document.getElementById('modalCoins').innerText = currentCoins;
            document.getElementById('modalPrice').innerText = currentPrice;
            
            // Exibe o modal
            document.getElementById('successModal').classList.add('active');
        }

        // Função para esconder o popup
        function hideModal() {
            document.getElementById('successModal').classList.remove('active');
        }
    </script>
</body>
</html>
